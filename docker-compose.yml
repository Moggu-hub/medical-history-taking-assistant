services:
  er-assistant:
    image: node:20-alpine
    container_name: er-assistant
    working_dir: /app
    command: >
      sh -c "mkdir -p /app /app/data /tmp/repo &&
      wget -qO /tmp/repo.tar.gz https://codeload.github.com/Moggu-hub/medical-history-taking-assistant/tar.gz/refs/heads/pilot-vps &&
      tar -xzf /tmp/repo.tar.gz -C /tmp/repo &&
      cp -rf /tmp/repo/medical-history-taking-assistant-*/* /app/ &&
      rm -rf /tmp/repo /tmp/repo.tar.gz &&
      node /app/server.js"
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DOCTOR_PIN=${DOCTOR_PIN:-1234}
    volumes:
      - er_patient_data:/app/data
    expose:
      - "3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.er-assistant.rule=Host(`er.rbsleeptest.com`)"
      - "traefik.http.routers.er-assistant.entrypoints=websecure,web"
      - "traefik.http.routers.er-assistant.tls=true"
      - "traefik.http.routers.er-assistant.tls.certresolver=mytlschallenge"
      - "traefik.http.services.er-assistant.loadbalancer.server.port=3001"

volumes:
  er_patient_data:
