services:
  er-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: node:20-alpine
    container_name: er-assistant
    working_dir: /app
    command: node server.js
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DOCTOR_PIN=${DOCTOR_PIN:-1234}
    volumes:
      - ./:/app
      - er_patient_data:/app/data
    expose:
      - "3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.er-assistant.rule=Host(`er.rbsleeptest.online`)"
      - "traefik.http.routers.er-assistant.entrypoints=websecure,web"
      - "traefik.http.routers.er-assistant.tls=true"
      - "traefik.http.routers.er-assistant.tls.certresolver=mytlschallenge"
      - "traefik.http.services.er-assistant.loadbalancer.server.port=3001"

volumes:
  er_patient_data:
